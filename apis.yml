aid: ragflow
name: RAGFlow
description: RAGFlow is the open-source Retrieval-Augmented Generation engine built by InfiniFlow Inc.
  It combines deep document understanding (DeepDoc parsing of PDFs, images, tables and scanned files)
  with hybrid retrieval — dense vector search, BM25 full-text and tensor/multi-vector re-ranking — and
  an integrated visual agent platform, to serve as a context layer for LLM applications. The platform
  ships as an Apache-2.0 self-hosted Docker deployment and as RAGFlow Cloud, a hosted multi-tenant service.
  Its RESTful HTTP API covers dataset (knowledge base) management, document ingestion and parsing, chunk
  management, retrieval, chat assistants, sessions, agents, memory, workspace file versioning and search
  apps, plus an OpenAI-compatible chat-completions surface. A first-party Python SDK and an optional self-hosted
  Model Context Protocol server expose the same retrieval core to agents.
