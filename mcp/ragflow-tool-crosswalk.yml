source: mcp/ragflow-mcp.yml + https://ragflow.io/docs/http_api_reference
note: >-
  RAGFlow publishes NO OpenAPI, so there are no operationIds to bind to. Each crosswalk row therefore
  names the REST method + path exactly as the HTTP API reference documents it, and the binding was
  confirmed against mcp/server/server.py, whose RAGFlowConnector calls those same endpoints. Confidence
  is high for all three rows because the mapping was read from the server's own source, not inferred
  from tool names.
surfaces:
  openapi: null
  openapi_note: No machine-readable specification is published for the RAGFlow HTTP API.
  rest_reference: https://ragflow.io/docs/http_api_reference
  rest_base: https://cloud.ragflow.io/api/v1
  graphql: null
  mcp: null
  mcp_note: >-
    Self-hosted only; the endpoint is whatever address the operator binds (default 127.0.0.1:9382,
    /mcp for streamable-HTTP and /sse for legacy SSE). No vendor-hosted MCP URL exists.
  gated:
  - RAGFlow HTTP API requires a Bearer API key; every operation is authenticated.
  - The MCP server requires a RAGFlow API key at launch (self-host mode) or per request (host mode).
