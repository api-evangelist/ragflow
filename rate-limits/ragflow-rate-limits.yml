  source: https://ragflow.io/docs/release_notes
self_hosted:
  note: >-
    A self-hosted RAGFlow deployment has no credits and no vendor-imposed limits. Its ceilings are the
    operator's own hardware, the configured document engine and the rate limits of whichever model
    providers are wired in.
gaps:
- No request-rate limit is published for RAGFlow Cloud, so an integrator cannot size a client.
- No rate-limit or quota headers are returned, so an agent cannot back off before being cut off.
- Credit consumption per operation is undefined, so the 500/5,000/20,000 figures are not convertible
  into a number of API calls.
