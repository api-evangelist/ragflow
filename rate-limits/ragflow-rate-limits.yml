source: https://ragflow.io/docs/http_api_reference + https://ragflow.io/#pricing-plan + live header probes of https://cloud.ragflow.io
api: ragflow-http-api
summary: >-
  RAGFlow publishes no request-rate limits and emits no rate-limit response headers. What it does
  publish is a monthly CREDIT allowance per RAGFlow Cloud tier — a usage quota, not a rate limit. Both
  facts are recorded below; the quota entries are marked kind: quota so they are not mistaken for
  runtime throttling signals.
limit_count: 3
request_rate_limits:
  documented: false
  count: 0
  note: >-
    The 238KB HTTP API reference contains no mention of rate limiting, throttling, 429 or Retry-After.
    The only occurrence of "rate-limited" in the whole document refers to a third-party You.com web
    search endpoint, not to RAGFlow itself.
response_headers:
  rate_limit_headers: []
  retry_after: false
  status_on_exhaustion: null
  probed:
  - url: https://cloud.ragflow.io/api/v1/system/healthz
    http_status: 200
    headers_returned: [server, date, content-type, content-length, vary, via]
    rate_limit_headers_present: false
  - url: https://cloud.ragflow.io/api/v1/datasets?page=1&page_size=1
    http_status: 401
    headers_returned: [server, date, content-type, content-length, vary, via]
    rate_limit_headers_present: false
  note: >-
    Neither X-RateLimit-*, RateLimit-* (RFC 9331 style) nor Retry-After appears on live responses. An
    agent has no runtime signal of remaining budget from this API at all.
