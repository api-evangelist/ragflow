api: ragflow-http-api
versioning:
  scheme: uri-path
  current_path_version: v1
  product_version: 0.27.0
  product_released: '2026-08-19'
  product_scheme: semver-zero
  note: >-
    Two versions are in play and only one of them moves. The URI path has been /api/v1 throughout, while
    the product has run from 0.18 to 0.27 with breaking behaviour changes in between. Because RAGFlow is
    predominantly self-hosted, the contract an integrator faces is set by the Docker image the operator
    deployed, not by the path version. RAGFlow Cloud tracks the current release. There is no version
    header, no Accept-version negotiation and no per-tenant version pinning on Cloud.
  capability_probe: GET /api/v1/system/healthz (unauthenticated; returns db / doc_engine / redis /
    storage / status)
deprecation:
  policy_published: true
  policy_form: >-
    A "Deprecated API Aliases" table at the head of the HTTP API reference, plus inline DEPRECATED
    admonitions on each affected operation. The reference states the v0.24.0 paths "remain available
    through the backward compatibility layer, but new integrations should use the replacement
    endpoints."
  compatibility_layer: true
  sunset_date_published: false
  rfc8594_headers: false
  headers_note: >-
    No Deprecation or Sunset response header is documented or observed. A client calling a deprecated
    alias gets no runtime signal at all — the deprecation exists only in prose.
  docs: https://ragflow.io/docs/http_api_reference
  deprecated_operations:
  - deprecated: POST /api/v1/chats_openai/{chat_id}/chat/completions
    replacement: POST /api/v1/openai/{chat_id}/chat/completions
  - deprecated: PUT /api/v1/chats/{chat_id}/sessions/{session_id}
    replacement: PATCH /api/v1/chats/{chat_id}/sessions/{session_id}
