status_page:
  published: false
  probed:
  - url: https://status.ragflow.io/
    status: '000'
    note: DNS does not resolve.
  - url: https://ragflow.statuspage.io/
    status: 200
    note: Atlassian Statuspage marketing site, not a RAGFlow status page.
  - url: https://ragflow.instatus.com/
    status: 200
    note: Instatus marketing site, not a RAGFlow status page.
  health_endpoint: https://cloud.ragflow.io/api/v1/system/healthz
  health_note: >-
    RAGFlow publishes no status page for RAGFlow Cloud. The unauthenticated healthz endpoint is the only
    availability signal an integrator has, and it reports component state (db, doc_engine, redis,
    storage) for the instance it is called on rather than a service history.
sla:
