  - deprecated: GET /v1/system/healthz
    replacement: GET /api/v1/system/healthz
  - deprecated: POST /v1/document/upload_info
    replacement: POST /api/v1/documents/upload
  - deprecated: POST /api/v1/file/upload
    replacement: POST /api/v1/files
